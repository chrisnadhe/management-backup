{% extends get_base_template(request) %}

{% block content %}
<div class="{% if request.headers.get('HX-Request') %}w-full{% else %}max-w-lg mx-auto mt-10 glass-panel p-8 rounded-2xl shadow-lg bg-white{% endif %}">
    <div class="flex items-center justify-between pb-4 mb-5 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900">{% if device %}Edit{% else %}New{% endif %} Device</h3>
        {% if request.headers.get('HX-Request') %}
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        {% endif %}
    </div>

    <form 
        method="post" 
        hx-post="{% if device %}/devices/{{ device.id }}/edit{% else %}/devices/new{% endif %}"
        {% if request.headers.get('HX-Request') %}
        hx-target="#devices-table-container"
        hx-swap="outerHTML"
        {% endif %}
        class="space-y-4"
    >
        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="hostname">
                Hostname
            </label>
            <input
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium"
                id="hostname" name="hostname" type="text" placeholder="Device Hostname"
                value="{{ device.hostname if device else '' }}" required>
        </div>
        
        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="ip_address">
                IP Address
            </label>
            <input
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm font-mono"
                id="ip_address" name="ip_address" type="text" placeholder="192.168.1.1"
                value="{{ device.ip_address if device else '' }}" required>
        </div>
        
        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="port">
                Port
            </label>
            <input
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm"
                id="port" name="port" type="number" placeholder="22" value="{{ device.port if device else 22 }}"
                required>
        </div>
        
        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="device_type">
                Device Type
            </label>
            <select
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm"
                id="device_type" name="device_type" required>
                <option value="cisco_ios" {% if device and device.device_type=='cisco_ios' %}selected{% endif %}>Cisco IOS</option>
                <option value="cisco_nxos" {% if device and device.device_type=='cisco_nxos' %}selected{% endif %}>Cisco NX-OS</option>
                <option value="juniper_junos" {% if device and device.device_type=='juniper_junos' %}selected{% endif %}>Juniper JunOS</option>
                <option value="arista_eos" {% if device and device.device_type=='arista_eos' %}selected{% endif %}>Arista EOS</option>
                <option value="hp_procurve" {% if device and device.device_type=='hp_procurve' %}selected{% endif %}>HP ProCurve</option>
                <option value="aruba_aoscx" {% if device and device.device_type=='aruba_aoscx' %}selected{% endif %}>Aruba AOS-CX</option>
                <option value="mikrotik_routeros" {% if device and device.device_type=='mikrotik_routeros' %}selected{% endif %}>Mikrotik RouterOS</option>
            </select>
        </div>
        
        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="credential_id">
                Credential
            </label>
            <select
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm"
                id="credential_id" name="credential_id" required>
                <option value="" disabled selected>Select a credential</option>
                {% for cred in credentials %}
                <option value="{{ cred.id }}" {% if device and device.credential_id==cred.id %}selected{% endif %}>
                    {{ cred.name }} ({{ cred.username }})
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="group_id">
                Group (Optional)
            </label>
            <select
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm"
                id="group_id" name="group_id">
                <option value="" selected>None</option>
                {% for group in groups %}
                <option value="{{ group.id }}" {% if device and device.group_id==group.id %}selected{% endif %}>
                    {{ group.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-6">
            {% if request.headers.get('HX-Request') %}
            <button 
                type="button" 
                onclick="closeModal()" 
                class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2 px-4 rounded-xl border border-slate-200 transition-all text-sm"
            >
                Cancel
            </button>
            {% else %}
            <a 
                href="/devices" 
                class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2 px-4 rounded-xl border border-slate-200 transition-all text-sm"
            >
                Cancel
            </a>
            {% endif %}
            <button
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-xl shadow-lg shadow-indigo-600/15 hover:shadow-indigo-600/25 transition-all text-sm"
                type="submit"
            >
                {% if device %}Update{% else %}Create{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
