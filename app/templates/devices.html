{% extends get_base_template(request) %}

{% block content %}
<div class="space-y-6">
    <!-- Header Card -->
    <div class="glass-panel p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Devices</h2>
            <p class="text-slate-500 text-sm">Manage network backup hostnames, IP addresses, and group assignments.</p>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
            <!-- Active Search Input -->
            <div class="relative w-full sm:w-72">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i class="fas fa-search text-xs"></i>
                </div>
                <input 
                    type="text" 
                    name="q" 
                    value="{{ q }}" 
                    hx-get="/devices" 
                    hx-trigger="keyup changed delay:300ms, search" 
                    hx-target="#devices-table-container"
                    placeholder="Search hostname or IP..."
                    class="w-full pl-9 pr-4 py-2 bg-slate-100/80 hover:bg-slate-200/50 focus:bg-white border border-transparent focus:border-indigo-500/30 rounded-xl text-sm transition-all focus:ring-4 focus:ring-indigo-500/10 focus:outline-none"
                >
            </div>
            
            <div class="flex gap-2 w-full sm:w-auto">
                <button 
                    hx-get="/devices/import/modal"
                    hx-target="#modal-content"
                    class="flex-1 sm:flex-none justify-center inline-flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2 px-4 rounded-xl text-sm border border-slate-200 hover:border-slate-300 transition-all shadow-sm">
                    <i class="fas fa-file-import text-slate-400"></i> Import
                </button>
                <button 
                    hx-get="/devices/new" 
                    hx-target="#modal-content"
                    class="flex-1 sm:flex-none justify-center inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl text-sm shadow-lg shadow-indigo-600/15 hover:shadow-indigo-600/25 transition-all">
                    <i class="fas fa-plus"></i> Add Device
                </button>
            </div>
        </div>
    </div>

    <!-- Table Container (Initially includes the table partial) -->
    <div id="devices-table-container">
        {% include "devices_table.html" %}
    </div>
</div>

<!-- Dynamic Backup Modal (Client-side trigger, but could also be HTMX modal if needed. Let's keep backupModal simple but styled) -->
<div id="backupModal" class="fixed inset-0 z-50 flex items-center justify-center modal-hidden" aria-modal="true" role="dialog">
    <!-- Overlay -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onclick="closeBackupModal()"></div>
    <!-- Modal wrapper -->
    <div class="relative z-10 w-full max-w-md mx-4 glass-panel rounded-2xl shadow-2xl p-6 bg-white modal-content">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100">
            <h3 class="text-lg font-bold text-slate-900" id="modalTitle">Run Backup</h3>
            <button onclick="closeBackupModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <form id="backupForm" hx-post="" hx-swap="none" hx-on::after-request="closeBackupModal();">
            <div class="mb-5">
                <label class="block text-slate-700 text-sm font-semibold mb-2">Command Template (Optional)</label>
                <select name="command_id" id="commandSelect"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm">
                    <option value="">-- All Commands --</option>
                    {% for cmd in commands %}
                    <option value="{{ cmd.id }}" data-platform="{{ cmd.platform }}">{{ cmd.name }}</option>
                    {% endfor %}
                </select>
                <p class="text-[11px] text-slate-400 mt-1.5 leading-relaxed">Select a specific command template or leave empty to run all commands for the platform.</p>
            </div>
            
            <div class="flex justify-end gap-3 border-t border-slate-100 pt-4 mt-6">
                <button type="button" onclick="closeBackupModal()"
                    class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2 px-4 rounded-xl border border-slate-200 transition-all text-sm">
                    Cancel
                </button>
                <button type="submit"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-5 rounded-xl shadow-lg shadow-emerald-600/15 hover:shadow-emerald-600/25 transition-all text-sm flex items-center gap-1.5">
                    <i class="fas fa-play text-[10px]"></i> Start Backup
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    // Backup modal client helpers (integrating HTMX triggers)
    function openBackupModal(deviceId, hostname, deviceType) {
        const modal = document.getElementById('backupModal');
        modal.classList.remove('modal-hidden');
        document.body.classList.add('overflow-hidden');
        
        document.getElementById('modalTitle').innerText = 'Run Backup: ' + hostname;
        
        // Setup HTMX trigger path
        const form = document.getElementById('backupForm');
        form.setAttribute('hx-post', '/backups/run/' + deviceId);
        
        // Process template option filtering
        const select = document.getElementById('commandSelect');
        const options = select.getElementsByTagName('option');

        for (let i = 0; i < options.length; i++) {
            const opt = options[i];
            if (opt.value === "") continue; 

            const platform = opt.getAttribute('data-platform');
            if (platform === deviceType) {
                opt.style.display = 'block';
                opt.disabled = false;
            } else {
                opt.style.display = 'none';
                opt.disabled = true;
            }
        }
        select.value = "";
        
        // Re-process HTMX bindings since hx-post changed dynamically
        htmx.process(form);
    }

    function closeBackupModal() {
        const modal = document.getElementById('backupModal');
        modal.classList.add('modal-hidden');
        document.body.classList.remove('overflow-hidden');
    }
</script>
{% endblock %}
