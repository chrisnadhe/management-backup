{% extends get_base_template(request) %}

{% block content %}
<div class="space-y-6">
    <!-- Header Card -->
    <div class="glass-panel p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Backup Commands</h2>
            <p class="text-slate-500 text-sm">Define custom CLI configuration templates for Netmiko to download configs across different OS platforms.</p>
        </div>
        
        <div>
            <button 
                hx-get="/commands/new" 
                hx-target="#modal-content"
                class="w-full sm:w-auto inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl text-sm shadow-lg shadow-indigo-600/15 hover:shadow-indigo-600/25 transition-all">
                <i class="fas fa-plus"></i> Add Command
            </button>
        </div>
    </div>

    <!-- Table Container (Initially includes the table partial) -->
    <div id="commands-table-container">
        {% include "commands_table.html" %}
    </div>
</div>
{% endblock %}
