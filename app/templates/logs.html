{% extends get_base_template(request) %}

{% block content %}
<div class="space-y-6">
    <!-- Header Card -->
    <div class="glass-panel p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Netmiko Connection Logs</h2>
            <p class="text-slate-500 text-sm">Review full SSH terminal session traces and raw interactions for diagnostics.</p>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
            <!-- Active Search Input -->
            <div class="relative w-full sm:w-72">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i class="fas fa-search text-xs"></i>
                </div>
                <input 
                    type="text" 
                    name="q" 
                    value="{{ q }}" 
                    hx-get="/logs" 
                    hx-trigger="keyup changed delay:300ms, search" 
                    hx-target="#logs-table-container"
                    placeholder="Search device or status..."
                    class="w-full pl-9 pr-4 py-2 bg-slate-100/80 hover:bg-slate-200/50 focus:bg-white border border-transparent focus:border-indigo-500/30 rounded-xl text-sm transition-all focus:ring-4 focus:ring-indigo-500/10 focus:outline-none"
                >
            </div>
        </div>
    </div>

    <!-- Table Container (Initially includes the table partial) -->
    <div id="logs-table-container">
        {% include "logs_table.html" %}
    </div>
</div>
{% endblock %}
