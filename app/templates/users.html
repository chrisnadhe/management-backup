{% extends get_base_template(request) %}

{% block content %}
<div class="space-y-6">
    <!-- Header Card -->
    <div class="glass-panel p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="text-2xl font-bold text-slate-900 tracking-tight flex items-center gap-2">
                <i class="fas fa-users text-indigo-600 text-xl"></i>
                User Management
            </h2>
            <p class="text-slate-500 text-sm">Manage user accounts, roles, and access permissions.</p>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto">
            {% if is_admin %}
            <button
                hx-get="/users/new"
                hx-target="#modal-content"
                hx-swap="innerHTML"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-xl text-sm shadow-lg shadow-indigo-600/15 hover:shadow-indigo-600/25 transition-all">
                <i class="fas fa-plus"></i> Add User
            </button>
            {% endif %}
        </div>
    </div>

    <!-- Table Container (Initially includes the table partial) -->
    <div id="users-table-container">
        {% include "users_table.html" %}
    </div>
</div>
{% endblock %}
