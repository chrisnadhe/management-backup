{% extends get_base_template(request) %}

{% block content %}
<div class="{% if request.headers.get('HX-Request') %}w-full{% else %}max-w-lg mx-auto mt-10 glass-panel p-8 rounded-2xl shadow-lg bg-white{% endif %}">
    <div class="flex items-center justify-between pb-4 mb-5 border-b border-slate-100">
        <h3 class="text-lg font-bold text-slate-900">{% if group %}Edit{% else %}New{% endif %} Group</h3>
        {% if request.headers.get('HX-Request') %}
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        {% endif %}
    </div>

    <form 
        method="post" 
        hx-post="{% if group %}/groups/{{ group.id }}/edit{% else %}/groups/new{% endif %}"
        {% if request.headers.get('HX-Request') %}
        hx-target="#groups-table-container"
        hx-swap="outerHTML"
        {% endif %}
        class="space-y-4"
    >
        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="name">
                Name
            </label>
            <input
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm font-medium"
                id="name" name="name" type="text" placeholder="Group Name" 
                value="{{ group.name if group else '' }}" required>
        </div>

        <div>
            <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2" for="description">
                Description
            </label>
            <textarea
                class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2 px-3 text-slate-700 leading-tight focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 focus:bg-white transition-all text-sm"
                id="description" name="description" placeholder="Description (Optional)"
                rows="3">{{ group.description if group else '' }}</textarea>
        </div>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 mt-6">
            {% if request.headers.get('HX-Request') %}
            <button 
                type="button" 
                onclick="closeModal()" 
                class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2 px-4 rounded-xl border border-slate-200 transition-all text-sm"
            >
                Cancel
            </button>
            {% else %}
            <a 
                href="/groups" 
                class="bg-white hover:bg-slate-50 text-slate-700 font-semibold py-2 px-4 rounded-xl border border-slate-200 transition-all text-sm"
            >
                Cancel
            </a>
            {% endif %}
            <button
                class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-xl shadow-lg shadow-indigo-600/15 hover:shadow-indigo-600/25 transition-all text-sm"
                type="submit"
            >
                {% if group %}Update{% else %}Create{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
