{% extends get_base_template(request) %}

{% block content %}
<div class="space-y-6">
    <!-- Header Card -->
    <div class="glass-panel p-6 rounded-2xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex flex-col sm:flex-row items-center gap-4 w-full md:w-auto">
            <div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Backups</h2>
                <p class="text-slate-500 text-sm">Download configuration archives, check execution status, and review logs.</p>
            </div>
            
            <!-- View Mode Switch Tabs -->
            <div class="flex bg-slate-100 p-1 rounded-xl w-full sm:w-auto self-stretch sm:self-center">
                <button 
                    hx-get="/backups?view=list&q={{ q }}" 
                    hx-target="#backups-table-container"
                    hx-push-url="true"
                    class="flex-1 sm:flex-none text-center px-4 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 focus:outline-none {% if view == 'list' %}bg-white text-slate-950 shadow-sm{% else %}text-slate-500 hover:text-slate-800{% endif %}"
                    id="list-view-tab"
                    onclick="switchTabActive(this)">
                    List View
                </button>
                <button 
                    hx-get="/backups?view=grouped&q={{ q }}" 
                    hx-target="#backups-table-container"
                    hx-push-url="true"
                    class="flex-1 sm:flex-none text-center px-4 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 focus:outline-none {% if view == 'grouped' %}bg-white text-slate-950 shadow-sm{% else %}text-slate-500 hover:text-slate-800{% endif %}"
                    id="grouped-view-tab"
                    onclick="switchTabActive(this)">
                    Grouped View
                </button>
            </div>
        </div>
        
        <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
            <!-- Active Search Input -->
            <div class="relative w-full sm:w-64">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i class="fas fa-search text-xs"></i>
                </div>
                <input 
                    type="text" 
                    name="q" 
                    value="{{ q }}" 
                    hx-get="/backups" 
                    hx-trigger="keyup changed delay:300ms, search" 
                    hx-target="#backups-table-container"
                    placeholder="Search device, status..."
                    class="w-full pl-9 pr-4 py-2 bg-slate-100/80 hover:bg-slate-200/50 focus:bg-white border border-transparent focus:border-indigo-500/30 rounded-xl text-sm transition-all focus:ring-4 focus:ring-indigo-500/10 focus:outline-none"
                    id="search-input"
                >
            </div>
        </div>
    </div>

    <!-- Table Container (Initially includes the table partial) -->
    <div id="backups-table-container">
        {% include "backups_table.html" %}
    </div>
</div>



<script>
    // Tab styling toggle JS helper
    function switchTabActive(clickedBtn) {
        const parent = clickedBtn.parentElement;
        const buttons = parent.querySelectorAll('button');
        buttons.forEach(btn => {
            btn.className = "flex-1 sm:flex-none text-center px-4 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 focus:outline-none text-slate-500 hover:text-slate-800";
        });
        clickedBtn.className = "flex-1 sm:flex-none text-center px-4 py-1.5 rounded-lg text-xs font-semibold transition-all duration-200 focus:outline-none bg-white text-slate-950 shadow-sm";
    }

    // Expandable logs
    function toggleRow(rowId) {
        const row = document.getElementById(rowId);
        const icon = document.getElementById('icon-' + rowId);

        if (row.classList.contains('hidden')) {
            row.classList.remove('hidden');
            if (icon) icon.className = 'fas fa-chevron-up transition-transform duration-200 text-xs text-indigo-600';
        } else {
            row.classList.add('hidden');
            if (icon) icon.className = 'fas fa-chevron-down transition-transform duration-200 text-xs text-slate-400';
        }
    }
    
    // Inject active search parameters on view triggers
    document.addEventListener('htmx:configRequest', function(evt) {
        const searchInput = document.getElementById('search-input');
        if (searchInput && searchInput.value) {
            evt.detail.parameters['q'] = searchInput.value;
        }
    });
</script>
{% endblock %}
