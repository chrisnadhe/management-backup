<div id="commands-table-container">
    <div class="overflow-hidden border border-slate-200/80 rounded-2xl shadow-sm bg-white">
        <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50 text-slate-500 text-xs font-semibold uppercase tracking-wider">
                <tr>
                    <th scope="col" class="py-4 px-6 text-left">Command Name</th>
                    <th scope="col" class="py-4 px-6 text-left">Platform</th>
                    <th scope="col" class="py-4 px-6 text-left">Command Script</th>
                    <th scope="col" class="py-4 px-6 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm text-slate-700 bg-white">
                {% for command in commands %}
                <tr id="command-row-{{ command.id }}" class="hover:bg-slate-50/80 transition-colors">
                    <td class="py-4 px-6 font-semibold text-slate-900">{{ command.name }}</td>
                    <td class="py-4 px-6">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-800">
                            {{ command.platform }}
                        </span>
                    </td>
                    <td class="py-4 px-6">
                        <code class="px-2 py-1 bg-slate-50 rounded-lg text-slate-600 border border-slate-100 font-mono text-xs block truncate max-w-xs">
                            {{ command.command_text }}
                        </code>
                    </td>
                    <td class="py-4 px-6 text-right whitespace-nowrap">
                        <div class="inline-flex gap-2">
                            <button
                                hx-get="/commands/{{ command.id }}/edit"
                                hx-target="#modal-content"
                                class="inline-flex items-center gap-1 bg-white hover:bg-slate-50 text-slate-700 font-medium py-1.5 px-3 rounded-lg text-xs border border-slate-200 hover:border-slate-300 transition-all">
                                <i class="fas fa-edit text-[10px] text-slate-400"></i> Edit
                            </button>
                            <button
                                hx-get="/commands/{{ command.id }}/delete/confirm"
                                hx-target="#modal-content"
                                class="inline-flex items-center gap-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-medium py-1.5 px-3 rounded-lg text-xs border border-rose-100 hover:border-rose-200 transition-all">
                                <i class="fas fa-trash-alt text-[10px] text-rose-400"></i> Delete
                            </button>
                        </div>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="4" class="py-8 px-6 text-center text-slate-400 italic bg-white">
                        No commands found. Click "Add Command" to create one.
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
